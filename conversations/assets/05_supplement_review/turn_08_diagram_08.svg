<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(13, 13, 13)" viewBox="0 0 330 260" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="89" y="5" width="152" height="30" rx="6" fill="#dce9f9" stroke="#7da7d6"/><text x="165" y="24" text-anchor="middle" font-size="12" fill="#1d4c86">classify(fine)</text><path d="M165 35 V47" stroke="currentColor" fill="none"/><rect x="89" y="47" width="152" height="35" rx="6" fill="#dce9f9" stroke="#7da7d6"/><text x="165" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4c86">guarded</text><text x="165" y="75" text-anchor="middle" font-size="9.5" fill="#1d4c86">最终分类结果缓存</text><path d="M165 82 V96" stroke="currentColor" fill="none"/><rect x="89" y="96" width="152" height="35" rx="6" fill="#e0f1ed" stroke="#79b6a3"/><text x="165" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#166d5d">parents</text><text x="165" y="124" text-anchor="middle" font-size="9.5" fill="#166d5d">初级父格与 full 判定缓存</text><path d="M165 131 V145" stroke="currentColor" fill="none"/><rect x="89" y="145" width="152" height="35" rx="6" fill="#fbead5" stroke="#d8aa69"/><text x="165" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#8b571e">full_cells</text><text x="165" y="173" text-anchor="middle" font-size="9.5" fill="#8b571e">父格对应的 full 候选细格集合</text><path d="M165 180 V194" stroke="currentColor" fill="none"/><rect x="60" y="194" width="210" height="39" rx="6" fill="#f0f0f0" stroke="#aaa"/><text x="165" y="210" text-anchor="middle" font-size="10.5" fill="#444">必要时构建多边形和 full 集合</text><text x="165" y="224" text-anchor="middle" font-size="10.5" fill="#444">随后执行顶点余量探测</text><text x="165" y="250" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".7">示